name: Enrich ENEM Database

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Anos separados por vírgula"
        required: false
        default: "2023"
  push:
    branches: [main]
    paths:
      - ".github/workflows/enrich-database.yml"
      - "montador-enem/scripts/enrich-inep.mjs"
      - "montador-enem/scripts/inep-enrichment-lib.mjs"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: montador-enem/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 unzip

      - name: Install application dependencies
        working-directory: montador-enem
        run: npm ci

      - name: Enrich database from official INEP microdata
        working-directory: montador-enem
        env:
          YEARS: ${{ github.event.inputs.years || '2023' }}
        run: node scripts/enrich-inep.mjs --years "$YEARS" --verbose

      - name: Validate application
        working-directory: montador-enem
        run: npm test

      - name: Sync database artifacts
        working-directory: montador-enem
        run: npm run sync:database

      - name: Update versioned site database
        run: |
          cp enem.sqlite docs/enem.sqlite
          cp montador-enem/public/enem.sqlite.meta.json docs/enem.sqlite.meta.json

      - name: Commit enriched database
        run: |
          if git diff --quiet -- enem.sqlite docs/enem.sqlite docs/enem.sqlite.meta.json; then
            echo "No database changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enem.sqlite docs/enem.sqlite docs/enem.sqlite.meta.json
          git commit -m "data: enrich ENEM database with official INEP metadata"
          git push
